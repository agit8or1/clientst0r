name: cross-peer-e2e

# ClientSt0r against a real Rem0te over the ticket-rmm-v1 contract (Ed25519):
# pairing, ticket analysis, staff-only results, alert → exactly one ticket
# linked back, restart/retry exactly-once, same computer name in two
# organizations, revoked access, an unavailable peer, L1 limits and
# secret-free failure reasons, and (s12) the remediation chain: a Rem0te
# alert → ticket → a technician's catalog-action proposal → approval ONLY on
# Rem0te's approval signer by a distinct approver (test-only signer, key,
# roster and synthetic passkeys in the run's work directory) → Rem0te's own
# agent decision code runs it against a simulated Windows → result note →
# alert.resolved; (s13) direct mode refuses ClientSt0r proposals.
# scripts/e2e/cross_peer/run.py does the work;
# this job only provides Postgres, Redis, the pinned Rem0te build and the
# Python dependencies. All data is synthetic; ClientSt0r runs on a throwaway
# SQLite file.
#
# Rem0te is checked out at the revision ClientSt0r's vendored contract is
# pinned to (integrations/rem0te/contract/PIN.json). Bumping the pin bumps
# what this job tests. If the Rem0te repository is private, add a read-only
# token as the REM0TE_READ_TOKEN secret.

on:
  pull_request:
    paths:
      - 'integrations/rem0te/**'
      - 'integrations/ticket_rmm.py'
      - 'integrations/forms.py'
      - 'psa_ai/**'
      - 'tech_access/**'
      - 'scripts/e2e/cross_peer/**'
      - '.github/workflows/cross-peer-e2e.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'integrations/rem0te/**'
      - 'psa_ai/**'
      - 'scripts/e2e/cross_peer/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-peer-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-peer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rem0te
          POSTGRES_PASSWORD: rem0te
          POSTGRES_DB: rem0te_e2e_scratch
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U rem0te" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://rem0te:rem0te@127.0.0.1:5432/rem0te_e2e_scratch?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      REM0TE_SRC: ${{ github.workspace }}/rem0te
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned Rem0te revision
        id: pin
        run: echo "sha=$(python3 -c 'import json;print(json.load(open("integrations/rem0te/contract/PIN.json"))["rem0te_sha"])')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: agit8or1/rem0te
          ref: ${{ steps.pin.outputs.sha }}
          path: rem0te
          token: ${{ secrets.REM0TE_READ_TOKEN || github.token }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: rem0te/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rem0te/pnpm-lock.yaml

      - name: Build Rem0te
        working-directory: rem0te
        run: |
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm --filter "@reboot-remote/api..." build  # the API and the workspace packages it uses

      # s12/s13: the offline release tool (signed update repository with the
      # signer's approval/keys.json) and the agent's action verifier/executor
      # against a simulated Windows — the binaries Rem0te's own
      # e2e-approved-action suite uses. Test-only; nothing is published.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: rem0te/tools/windows-installer/go.mod
          cache-dependency-path: rem0te/tools/windows-installer/go.sum

      - name: Build Rem0te's release tool and action simulator
        working-directory: rem0te/tools/windows-installer
        run: |
          go build -o "$RUNNER_TEMP/bin/rem0te-release" ./cmd/rem0te-release
          go build -o "$RUNNER_TEMP/bin/rem0te-action-sim" ./cmd/rem0te-action-sim
          echo "RELEASE_BIN=$RUNNER_TEMP/bin/rem0te-release" >> "$GITHUB_ENV"
          echo "ACTION_SIM=$RUNNER_TEMP/bin/rem0te-action-sim" >> "$GITHUB_ENV"

      - name: Migrate and seed Rem0te's scratch database
        working-directory: rem0te
        run: |
          pnpm db:migrate
          pnpm db:seed

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: ClientSt0r dependencies
        run: |
          python -m venv venv
          venv/bin/pip install --quiet -r requirements.txt

      - name: Cross-peer run
        run: bash scripts/e2e/cross_peer/run.sh --work "$RUNNER_TEMP/cross-peer" --cs-port 18431 --rem0te-port 3141 --llm-port 18432

      - name: Results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-peer-e2e
          path: |
            ${{ runner.temp }}/cross-peer/results.json
            ${{ runner.temp }}/cross-peer/logs/
          if-no-files-found: warn
