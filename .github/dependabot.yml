# Keeps the commit-SHA pins in .github/workflows current. Every action is
# pinned to a full SHA with the release in a comment (v3.17.695); Dependabot
# updates both together.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # A new action release waits a week before Dependabot proposes it, so a
    # compromised or broken release is usually caught upstream first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
