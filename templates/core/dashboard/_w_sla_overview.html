<div class="dash-sla-head">
    {% if w.compliance is not None %}<strong class="dash-sla-pct">{{ w.compliance }}%</strong> <span class="dash-row-sub d-inline">of running SLAs within deadline</span>
    {% else %}<span class="dash-row-sub d-inline">No open tickets with a running SLA</span>{% endif %}
</div>
<ul class="dash-bars">
    {% for r in w.rows %}
    <li>
        <a href="{{ w.more_url }}" class="dash-bar-row">
            <span class="dash-bar-label">{{ r.label }}</span>
            <span class="dash-bar-track" aria-hidden="true"><span class="dash-bar-fill dash-fill-{{ r.tone }}" style="width: {{ r.pct }}%"></span></span>
            <strong class="dash-bar-value">{{ r.count }}</strong>
        </a>
    </li>
    {% endfor %}
</ul>
<div class="dash-w-foot">{{ w.total }} open ticket{{ w.total|pluralize }} at this customer</div>
