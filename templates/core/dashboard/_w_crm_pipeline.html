{% load humanize %}
<ul class="dash-bars">
    {% for r in w.rows %}
    <li>
        <a href="{{ w.more_url }}" class="dash-bar-row">
            <span class="dash-bar-label">{{ r.label }}</span>
            <span class="dash-bar-track" aria-hidden="true"><span class="dash-bar-fill" style="width: {{ r.pct }}%"></span></span>
            <strong class="dash-bar-value" title="Estimated value {{ r.value|floatformat:0|intcomma }}">{{ r.count }}</strong>
        </a>
    </li>
    {% endfor %}
</ul>
<div class="dash-w-foot">{{ w.total }} open opportunit{{ w.total|pluralize:"y,ies" }} · estimated value {{ w.value|floatformat:0|intcomma }}</div>
