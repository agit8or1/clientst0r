{% load i18n %}<li class="app-nav__group{% if g.active %} is-active{% endif %}" data-group="{{ g.key }}"{% if g.shortcut %} data-shortcut-key="{{ g.shortcut }}"{% endif %}>
    <div class="app-nav__group-head">
        <a class="app-nav__group-link{% if g.active %} active{% endif %}" href="{{ g.href }}" title="{{ g.label }}"{% if g.href == request.path %} aria-current="page"{% endif %}{% if g.shortcut %} aria-keyshortcuts="g {{ g.shortcut }}"{% endif %}>
            <i class="{{ g.icon }} fa-fw" aria-hidden="true"></i><span class="app-nav__text">{{ g.label }}</span>
        </a>
        {% if g.entries|length > 1 or g.entries.0.children %}
        <button type="button" class="app-nav__toggle" aria-expanded="{% if g.active %}true{% else %}false{% endif %}"
                aria-controls="appNavGroup-{{ g.key }}"
                aria-label="{% blocktrans with name=g.label %}Show {{ name }} pages{% endblocktrans %}">
            <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        {% endif %}
    </div>
    <ul class="app-nav__entries" id="appNavGroup-{{ g.key }}"{% if not g.active %} hidden{% endif %}>
        {% for e in g.entries %}
        <li class="app-nav__entry" data-filter="{{ e.label }} {{ e.keywords }} {{ g.label }}">
            <a class="app-nav__link{% if e.active %} active{% endif %}" href="{{ e.href }}" title="{{ e.label }}"{% if e.href == request.path %} aria-current="page"{% endif %}>
                <i class="{{ e.icon }} fa-fw" aria-hidden="true"></i><span class="app-nav__text">{{ e.label }}</span>
            </a>
            {% if e.children %}
            <ul class="app-nav__sub"{% if not e.active %} hidden{% endif %}>
                {% for c in e.children %}
                <li data-filter="{{ c.label }} {{ e.label }} {{ g.label }}"><a class="app-nav__sublink{% if c.active %} active{% endif %}" href="{{ c.href }}"{% if c.active %} aria-current="page"{% endif %}>{{ c.label }}</a></li>
                {% endfor %}
            </ul>
            {% endif %}
        </li>
        {% endfor %}
    </ul>
</li>
