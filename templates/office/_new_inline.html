{% if show %}
<div class="mb-3 office-new-inline">
  <label class="form-label" for="office-new-type">What are you creating?</label>
  <select class="form-select" id="office-new-type" style="max-width: 26rem">
    <option value="" selected>Rich text document (rich text, Markdown, diagram or an uploaded file)</option>
    {% for fmt, label in formats %}
    <option value="{{ fmt }}" data-action="{% url 'office:new_document' fmt %}">{% if fmt == 'docx' %}Word document (.docx){% elif fmt == 'xlsx' %}Excel workbook (.xlsx){% else %}PowerPoint presentation (.pptx){% endif %}</option>
    {% endfor %}
  </select>
  <form method="post" action="" id="office-new-form" class="mt-3" hidden>
    {% csrf_token %}
    <label class="form-label" for="office-new-title">Name</label>
    <div class="input-group" style="max-width: 32rem">
      <input type="text" class="form-control" id="office-new-title" name="title" placeholder="Name" maxlength="200" required>
      <button type="submit" class="btn btn-primary" id="office-new-submit">Create</button>
    </div>
    <small class="text-muted d-block mt-1">Created blank in this organization; open it with Edit to work on it in the Office editor. Older .doc, .xls and .ppt files can be uploaded and opened; new files use the current formats.</small>
  </form>
</div>
<script nonce="{{ csp_nonce }}">
(function () {
  var type = document.getElementById('office-new-type');
  var form = document.getElementById('office-new-form');
  if (!type || !form) return;
  function apply() {
    var opt = type.options[type.selectedIndex];
    var office = !!type.value;
    form.hidden = !office;
    if (office) form.action = opt.getAttribute('data-action');
    // Everything else on the page belongs to the rich text form.
    document.querySelectorAll('[data-office-richtext]').forEach(function (el) { el.hidden = office; });
  }
  type.addEventListener('change', apply);
  apply();
})();
</script>
{% endif %}
