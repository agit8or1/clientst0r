<div class="border rounded p-2 mb-2" data-signer>
    <input type="hidden" name="signer-{{ i }}-deleted" value="0" data-deleted>
    <div class="row g-2">
        <div class="col-7"><label class="form-label small mb-0" for="signer-{{ i }}-role">Role</label>
            <select class="form-select form-select-sm" id="signer-{{ i }}-role" name="signer-{{ i }}-role" data-signer-role>
                <option value="client" {% if sg.role != 'internal' %}selected{% endif %}>Client signer</option>
                <option value="internal" {% if sg.role == 'internal' %}selected{% endif %}>Internal countersigner</option></select></div>
        <div class="col-3"><label class="form-label small mb-0" for="signer-{{ i }}-order">Order</label>
            <input class="form-control form-control-sm" type="number" min="1" max="99" id="signer-{{ i }}-order" name="signer-{{ i }}-order" value="{{ sg.order|default:1 }}"></div>
        <div class="col-2 d-flex align-items-end"><button type="button" class="btn btn-sm btn-outline-danger w-100" data-remove-signer aria-label="Remove signer"><i class="fas fa-times"></i></button></div>
        <div class="col-12" data-internal-only {% if sg.role != 'internal' %}hidden{% endif %}><label class="form-label small mb-0" for="signer-{{ i }}-user">Staff account (signs while signed in)</label>
            <select class="form-select form-select-sm" id="signer-{{ i }}-user" name="signer-{{ i }}-user"><option value="">— none (e-mail link only) —</option>{% for u in countersigners %}<option value="{{ u.pk }}" {% if sg.user_id == u.pk %}selected{% endif %}>{{ u.get_full_name|default:u.username }}</option>{% endfor %}</select></div>
        <div class="col-12 col-sm-6"><label class="form-label small mb-0" for="signer-{{ i }}-name">Name</label><input class="form-control form-control-sm" id="signer-{{ i }}-name" name="signer-{{ i }}-name" value="{{ sg.name }}" maxlength="200"></div>
        <div class="col-12 col-sm-6"><label class="form-label small mb-0" for="signer-{{ i }}-email">E-mail</label><input class="form-control form-control-sm" type="email" id="signer-{{ i }}-email" name="signer-{{ i }}-email" value="{{ sg.email }}"></div>
        <div class="col-12"><label class="form-label small mb-0" for="signer-{{ i }}-title">Title</label><input class="form-control form-control-sm" id="signer-{{ i }}-title" name="signer-{{ i }}-title" value="{{ sg.title }}" maxlength="200"></div>
    </div>
</div>
